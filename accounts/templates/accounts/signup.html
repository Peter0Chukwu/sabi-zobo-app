<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Zobo</title>
</head>
<body>
    <h1>Create Your Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="ref_code" value="{{ ref_code }}">
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</body>
</html>
