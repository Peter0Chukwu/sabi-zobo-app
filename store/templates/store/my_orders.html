<!DOCTYPE html>
<html>
<head>
    <title>My Orders - Zobo</title>
</head>
<body>
    <h1>My Orders</h1>
    <a href="{% url 'product_page' %}">Back to shop</a>

    <table border="1" cellpadding="8">
        <tr>
            <th>Order ID</th>
            <th>Product</th>
            <th>Amount Paid</th>
            <th>Status</th>
            <th>Date</th>
        </tr>
        {% for order in orders %}
        <tr>
            <td>#{{ order.id }}</td>
            <td>{{ order.product.name }}</td>
            <td>₦{{ order.price_paid }}</td>
            <td>{{ order.status }}</td>
            <td>{{ order.created_at|date:"d M Y, H:i" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No orders yet.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
